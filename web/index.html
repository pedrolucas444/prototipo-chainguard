<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ChainGuard: monitoramento e análise de risco de carteiras Ethereum, sem custódia." />
    <meta name="theme-color" content="#070A12" />
    <title>ChainGuard</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 36'%3E%3Cpath d='M16 2 5 6.6v8.8c0 7.2 4.6 13.8 11 17.6 6.4-3.8 11-10.4 11-17.6V6.6L16 2Z' fill='%23ff4d63'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="boot" class="boot"><div class="spinner"></div></div>

    <!-- Telas de acesso (login, cadastro, 2FA, recuperação) -->
    <div id="auth-root" class="auth-root" hidden></div>

    <!-- Aplicação autenticada -->
    <div class="app-shell" id="app-shell" hidden>
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="#/dashboard" aria-label="ChainGuard: início">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 36"><path d="M16 2 5 6.6v8.8c0 7.2 4.6 13.8 11 17.6 6.4-3.8 11-10.4 11-17.6V6.6L16 2Z"/><path d="m16 8-5.2 8 5.2 3 5.2-3L16 8Zm0 12.2-5.2-3.1L16 27l5.2-9.9-5.2 3.1Z"/></svg>
          </span>
          <span><strong>ChainGuard</strong><small>Ethereum security</small></span>
        </a>
        <nav class="side-nav" id="side-nav" aria-label="Navegação principal"></nav>
        <div class="sidebar-bottom">
          <div class="network-pill"><span class="network-dot"></span>Ethereum Mainnet</div>
          <a href="#/conta" class="settings-link" data-route="conta"><span data-icon="user"></span>Minha conta</a>
          <div class="profile">
            <span class="avatar" id="avatar">—</span>
            <span><strong id="profile-name">—</strong><small id="profile-role">—</small></span>
            <button class="mini-button" id="logout-button" aria-label="Sair" title="Sair"><span data-icon="logout"></span></button>
          </div>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <button class="icon-button mobile-menu" id="mobile-menu" aria-label="Abrir menu"><span data-icon="menu"></span></button>
          <div class="breadcrumb"><span>ChainGuard</span><b>/</b><strong id="page-crumb">Dashboard</strong></div>
          <div class="top-actions">
            <div class="sync-state" id="sync-state"><span></span><div><b id="sync-mode">Monitoramento ativo</b><small id="sync-time">—</small></div></div>
            <button class="btn primary compact" id="send-button"><span data-icon="send"></span><span class="hide-sm">Enviar</span></button>
            <button class="icon-button" id="theme-button" aria-label="Alternar tema claro/escuro"><span data-icon="sun"></span></button>
            <a class="icon-button alert-shortcut" href="#/alertas" aria-label="Ver alertas"><span data-icon="bell"></span><i id="top-alert-count" hidden>0</i></a>
          </div>
        </header>
        <div class="content" id="app" aria-live="polite"></div>
      </main>
    </div>

    <div class="mobile-overlay" id="mobile-overlay"></div>
    <div class="toast-region" id="toast-region" aria-live="assertive"></div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
